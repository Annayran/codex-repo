plugins {
    id 'java'
}

group = 'br.com.zaya'
version = 'V_1.0.0'

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-Xlint:unchecked'
}

repositories {
    mavenCentral()
}

// Pode ser sobrescrito com -PsankhyaDependenciesDir=... ou pela variavel
// SANKHYA_DEPENDENCIES_DIR. O fallback representa a estrutura padrao Zaya.IT.
def baseLibPath = providers.gradleProperty('sankhyaDependenciesDir')
        .orElse(providers.environmentVariable('SANKHYA_DEPENDENCIES_DIR'))
        .getOrElse('C:/dev/zaya/platform/modulos-sankhya/Dependencias')

if (!file(baseLibPath).isDirectory()) {
    throw new GradleException("Diretorio de dependencias Sankhya nao encontrado: ${baseLibPath}")
}

dependencies {
    // ===== LIBS LOCAIS (compileOnly) =====
    compileOnly fileTree(dir: "${baseLibPath}/Jar", include: ['*.jar'], exclude: ['pdfbox*.jar', 'fontbox*.jar'])
    compileOnly fileTree(dir: "${baseLibPath}/4_35", include: ['*.jar'], exclude: ['pdfbox*.jar', 'fontbox*.jar'])

    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.0'
    implementation 'org.json:json:20231013'

    // ===== PDF Processing =====
    implementation 'org.apache.pdfbox:pdfbox:2.0.30'

    // ===== Logging =====
    implementation 'org.slf4j:slf4j-api:2.0.9'
    implementation 'ch.qos.logback:logback-classic:1.4.14'

    // ===== TESTES =====
    testImplementation fileTree(dir: "${baseLibPath}/Jar", include: ['*.jar'], exclude: ['pdfbox*.jar', 'fontbox*.jar'])
    testImplementation fileTree(dir: "${baseLibPath}/4_35", include: ['*.jar'], exclude: ['pdfbox*.jar', 'fontbox*.jar'])

    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

jar {
    archiveFileName = 'ApontamentoProducao.jar'
}
