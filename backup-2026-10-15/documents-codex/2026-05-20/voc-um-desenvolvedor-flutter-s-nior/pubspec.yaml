name: af_health_lab
description: MVP Flutter for AF Health Lab, a human performance and athlete readiness platform.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cloud_firestore: ^5.6.0
  cupertino_icons: ^1.0.8
  firebase_auth: ^5.3.4
  firebase_core: ^3.9.0
  fl_chart: ^0.69.2
  flutter_svg: ^2.0.17
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  google_fonts: ^6.2.1
  google_sign_in: ^6.2.2
  intl: ^0.20.1

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
    - assets/brand/svg/
    - assets/icons/svg/
    - assets/patterns/
    - assets/patterns/svg/
    - assets/patterns/png/
    - assets/illustrations/
    - assets/illustrations/svg/
    - assets/illustrations/png/
    - assets/app_icon/png/
    - assets/reference/source_sheets/
