quarkus.http.host=127.0.0.1
quarkus.http.limits.max-body-size=256K
quarkus.http.auth.basic=true
quarkus.security.users.embedded.enabled=true
quarkus.security.users.embedded.plain-text=true
%dev.quarkus.security.users.embedded.users.demo-a=fixture-only-a
%dev.quarkus.security.users.embedded.roles.demo-a=investigator
%dev.quarkus.security.users.embedded.users.demo-b=fixture-only-b
%dev.quarkus.security.users.embedded.roles.demo-b=investigator
%test.quarkus.security.users.embedded.users.demo-a=fixture-only-a
%test.quarkus.security.users.embedded.roles.demo-a=investigator
%test.quarkus.security.users.embedded.users.demo-b=fixture-only-b
%test.quarkus.security.users.embedded.roles.demo-b=investigator
nexo.gateway=disabled
%dev.nexo.gateway=fixture
%test.nexo.gateway=fixture
nexo.identity-manifest=${NEXO_IDENTITY_MANIFEST:}
nexo.demo-identities=false
%dev.nexo.demo-identities=true
%test.nexo.demo-identities=true
nexo.storage=data
nexo.ai.enabled=${NEXO_AI_ENABLED:false}
nexo.max-items=100
nexo.timeout-ms=3000
nexo.knowledge-manifest=${NEXO_KNOWLEDGE_MANIFEST:}
%test.nexo.storage=target/test-investigations
%test.nexo.knowledge-manifest=src/test/resources/reviewed-knowledge.json
quarkus.langchain4j.openai.api-key=${OPENAI_API_KEY:disabled}
quarkus.langchain4j.openai.chat-model.model-name=${NEXO_MODEL:gpt-4o-mini}
quarkus.langchain4j.openai.timeout=10s
quarkus.langchain4j.openai.max-retries=1
quarkus.langchain4j.openai.log-requests=false
quarkus.langchain4j.openai.log-responses=false

# Local-only homologation: no paid API or public listener.
%local.quarkus.langchain4j.openai.base-url=http://127.0.0.1:11434/v1
%local.quarkus.langchain4j.openai.api-key=ollama
%local.quarkus.langchain4j.openai.chat-model.model-name=qwen2.5:3b
%local.quarkus.langchain4j.openai.chat-model.temperature=0
%local.quarkus.langchain4j.openai.timeout=180s
%local.quarkus.langchain4j.openai.max-retries=1
%local.nexo.ai.enabled=true
%local.nexo.gateway=fixture
%local.nexo.demo-identities=true
%local.nexo.storage=target/local-investigations
%local.quarkus.security.users.embedded.users.demo-a=fixture-only-a
%local.quarkus.security.users.embedded.roles.demo-a=investigator

