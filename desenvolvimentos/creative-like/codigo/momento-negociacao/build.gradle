plugins {
    id 'java'
}

group = 'br.zaya'
version = '1.0-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-Xlint:unchecked'
}

repositories {
    mavenCentral()
}

// Base das dependencias locais no Windows.
def baseLibPath = 'C:/zy-tools/modulos-sankhya/Dependencias'

dependencies {
    // ===== LIBS LOCAIS (compileOnly) =====
    compileOnly fileTree(dir: "${baseLibPath}/Jar", include: ['*.jar'], exclude: ['pdfbox*.jar', 'fontbox*.jar'])
    compileOnly fileTree(dir: "${baseLibPath}/4_35/4_35", include: ['*.jar'], exclude: ['pdfbox*.jar', 'fontbox*.jar'])

    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.0'

    // ===== PDF Processing =====
    implementation 'org.apache.pdfbox:pdfbox:2.0.30'

    // ===== Logging =====
    implementation 'org.slf4j:slf4j-api:2.0.9'
    implementation 'ch.qos.logback:logback-classic:1.4.14'

    // ===== TESTES =====
    testImplementation fileTree(dir: "${baseLibPath}/Jar", include: ['*.jar'], exclude: ['pdfbox*.jar', 'fontbox*.jar'])
    testImplementation fileTree(dir: "${baseLibPath}/4_35/4_35", include: ['*.jar'], exclude: ['pdfbox*.jar', 'fontbox*.jar'])

    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

jar {
    archiveFileName = 'CreativeLike.jar'
}
