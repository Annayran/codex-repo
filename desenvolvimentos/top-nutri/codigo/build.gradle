plugins {
    id 'java'
}

group = providers.gradleProperty('projectGroup').getOrElse('br.com.zaya')
version = providers.gradleProperty('projectVersion').getOrElse('1.0')

def companyCode = providers.gradleProperty('companyCode').getOrElse('ZAYA')
def projectCode = providers.gradleProperty('projectCode').getOrElse('TPN')
def projectTitle = providers.gradleProperty('projectTitle').getOrElse(rootProject.name)

if (!(companyCode ==~ /[A-Z0-9]+/)) {
    throw new GradleException('companyCode deve usar somente A-Z e 0-9')
}
if (!(projectCode ==~ /[A-Z0-9]+/)) {
    throw new GradleException('projectCode deve usar somente A-Z e 0-9')
}
if (!(version.toString() ==~ /[0-9]+\.[0-9]+/)) {
    throw new GradleException('projectVersion deve seguir MAJOR.MINOR, por exemplo 1.0')
}

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-Xlint:all'
}

repositories {
    mavenCentral()
}

def sankhyaDependenciesDir = providers.gradleProperty('sankhyaDependenciesDir')
        .orElse(providers.environmentVariable('SANKHYA_DEPENDENCIES_DIR'))
        .getOrElse('C:/dev/zaya/platform/modulos-sankhya/Dependencias')
def sankhyaVersionDir = providers.gradleProperty('sankhyaVersionDir').getOrElse('')

if (!file(sankhyaDependenciesDir).isDirectory()) {
    throw new GradleException(
            "Diretorio de dependencias Sankhya nao encontrado: ${sankhyaDependenciesDir}"
    )
}

dependencies {
    compileOnly fileTree(
            dir: "${sankhyaDependenciesDir}/Jar",
            include: ['*.jar'],
            exclude: ['pdfbox*.jar', 'fontbox*.jar']
    )

    if (sankhyaVersionDir) {
        compileOnly fileTree(
                dir: "${sankhyaDependenciesDir}/${sankhyaVersionDir}",
                include: ['*.jar'],
                exclude: ['pdfbox*.jar', 'fontbox*.jar']
        )
    }

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.0'
    testImplementation 'org.junit.platform:junit-platform-launcher:1.10.0'
}

test {
    useJUnitPlatform()
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

jar {
    archiveFileName = "${companyCode}-${projectCode}-V${version}.jar"
    manifest {
        attributes(
                'Implementation-Title': projectTitle,
                'Implementation-Version': version,
                'Implementation-Vendor': 'Zaya.IT',
                'Built-By': 'Zaya.IT Build'
        )
    }
}

tasks.register('html5ComponentZip', Zip) {
    archiveFileName = "${projectCode}_html5Component.zip"
    destinationDirectory = layout.buildDirectory.dir('distributions')
    from('src/main/webapp/html5') {
        include 'importacaoFormulas.jsp', 'logo-topnutri.svg', 'poppins-*.woff2', 'OFL-Poppins.txt'
    }
}

assemble.dependsOn(tasks.named('html5ComponentZip'))
